name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Fails when npm install would change package-lock.json. npm 11 is
      # stricter than the npm 10 that ships with Node 22: it also drops
      # stale entries, such as workspaces that no longer exist.
      - run: npx -y npm@11 install --package-lock-only --ignore-scripts --no-audit --no-fund && git diff --exit-code package-lock.json
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm pack --dry-run -w @usememos/ui

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results
          retention-days: 7

  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:visual
      # Holds the actual, expected and diff images of any screenshot that changed.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-results
          path: test-results
          retention-days: 7
